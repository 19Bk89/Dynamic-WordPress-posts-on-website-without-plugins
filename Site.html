<!-- Menu with posts -->
<div class="custom-menu-container" id="sticky-menu">
    <ul id="post-menu" class="horizontal-menu">
        <!-- Menu is dynamically generated here -->
    </ul>
</div>

<!-- Area where the selected post is displayed -->
<div id="post-content" class="post-display">
    <p>Select a post from the menu to display its content.</p>
</div>

<style>
    .horizontal-menu {
        display: flex;
        list-style-type: none;
        padding: 0;
        margin: 0;
        background-color: rgba(255, 255, 255, 0);
    }
    .horizontal-menu li {
        margin-right: 20px;
    }
    .horizontal-menu a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }
    .horizontal-menu a:hover {
        color: #0073aa;
    }
    .post-display {
        margin-top: 20px;
        padding: 10px;
    }
    #sticky-menu {
        position: relative;
        background-color: white;
        z-index: 1;
        transition: top 0.3s;
    }
    .sticky {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Manually define post URLs and titles here
        const posts = [
            { "title": "Post Title", "url": "https://example.com/post1" },
            { "title": "Another Post", "url": "https://example.com/post2" }
        ];

        const menu = document.getElementById('post-menu');
        posts.forEach(post => {
            const listItem = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#';
            link.textContent = post.title;
            link.setAttribute('data-post-url', post.url);

            // Event listener for clicking on a post
            link.addEventListener('click', function(event) {
                event.preventDefault();
                loadPostContent(post.url);
            });

            listItem.appendChild(link);
            menu.appendChild(listItem);
        });
        // Load the first post's content by default
        if (posts.length > 0) {
            loadPostContent(posts[0].url);
        }

        /*
         * Function to load the content of a specific post
         * postUrl: The URL of the post to load
         */
        function loadPostContent(postUrl) {
            document.getElementById('post-content').innerHTML = "<p>Loading post...</p>";
            fetch(postUrl)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const postContent = doc.querySelector('.entry-content');
                    document.getElementById('post-content').innerHTML = postContent ? postContent.innerHTML : "<p>Error</p>";
                })
                .catch(error => {
                    console.error("Error", error);
                    document.getElementById('post-content').innerHTML = "<p>Error</p>";
                });
        }

        // Sticky menu functionality
        const stickyMenu = document.getElementById('sticky-menu');
        const stickyOffset = stickyMenu.offsetTop;

        window.onscroll = function() {
            if (window.pageYOffset > stickyOffset) {
                stickyMenu.classList.add("sticky");
            } else {
                stickyMenu.classList.remove("sticky");
            }
        };
    });
</script>

<!--
 * To add new posts, modify the 'posts' array in the script above.
 * Example:
 * [
 *   { "title": "Post Title", "url": "https://example.com/post1" },
 *   { "title": "Another Post", "url": "https://example.com/post2" }
 * ]
 * This will automatically populate the menu with clickable links.
-->
